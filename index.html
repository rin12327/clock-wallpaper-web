<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock Live Wallpaper - Online Community Feed</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0b0f19; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        header { text-align: center; margin-bottom: 25px; }
        h1 { font-size: 26px; color: #38bdf8; }
        p { color: #94a3b8; font-size: 14px; margin-top: 5px; }

        .main-layout { display: flex; flex-wrap: wrap; max-width: 1200px; width: 100%; gap: 30px; justify-content: center; }

        /* Màn hình điện thoại giả lập preview */
        .preview-section { flex: 1; min-width: 300px; max-width: 340px; display: flex; flex-direction: column; align-items: center; }
        .phone-frame { width: 300px; height: 600px; background: #000; border: 10px solid #1e293b; border-radius: 36px; position: relative; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.8); }
        .bg-media { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        
        .clock-overlay { position: absolute; top: 35%; left: 50%; transform: translate(-50%, -50%); z-index: 2; text-align: center; cursor: move; user-select: none; touch-action: none; padding: 10px; width: 100%; }
        .time-display { font-size: 52px; font-weight: 700; color: #ffffff; text-shadow: 0 4px 12px rgba(0,0,0,0.9); }
        .date-display { font-size: 14px; font-weight: 500; color: #e2e8f0; text-shadow: 0 2px 8px rgba(0,0,0,0.9); margin-top: 4px; }

        /* Khung kho hình nền cộng đồng */
        .community-section { flex: 2; min-width: 340px; background: #1e293b; padding: 20px; border-radius: 20px; border: 1px solid #334155; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .upload-btn { padding: 8px 16px; background: #0284c7; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .upload-btn:hover { background: #0369a1; }

        /* Grid danh sách hình nền online */
        .wallpaper-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; max-height: 500px; overflow-y: auto; padding-right: 5px; }
        .wallpaper-card { position: relative; width: 100%; height: 220px; border-radius: 12px; overflow: hidden; cursor: pointer; border: 2px solid transparent; transition: 0.2s; }
        .wallpaper-card:hover { border-color: #38bdf8; transform: scale(1.02); }
        .wallpaper-card img, .wallpaper-card video { width: 100%; height: 100%; object-fit: cover; }
        .card-info { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,0.8)); padding: 8px; font-size: 11px; color: #fff; }

        /* Modal Đăng ảnh/video mới */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background: #1e293b; padding: 25px; border-radius: 16px; width: 340px; border: 1px solid #334155; }
        .modal-content h3 { margin-bottom: 15px; color: #38bdf8; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; margin-bottom: 4px; color: #cbd5e1; }
        .form-group input { width: 100%; padding: 8px; background: #0f172a; border: 1px solid #475569; border-radius: 6px; color: #fff; }
    </style>
</head>
<body>

    <header>
        <h1>🌐 Live Wallpaper Community</h1>
        <p>Khám phá & đăng tải hình nền động/tĩnh từ cộng đồng người dùng</p>
    </header>

    <div class="main-layout">
        <!-- Xem trước hình nền chọn -->
        <div class="preview-section">
            <div class="phone-frame" id="phoneFrame">
                <img id="bgImage" class="bg-media" src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe" alt="Wallpaper">
                <video id="bgVideo" class="bg-media" autoplay muted loop playsinline style="display: none;"></video>

                <div class="clock-overlay" id="clockOverlay">
                    <div class="time-display" id="timeText">00:00</div>
                    <div class="date-display" id="dateText">Thứ Sáu, 24 Th10</div>
                </div>
            </div>
        </div>

        <!-- Bảng danh sách hình nền Online -->
        <div class="community-section">
            <div class="section-header">
                <h3>Thư viện Online</h3>
                <button class="upload-btn" onclick="openUploadModal()">📤 Đăng hình nền</button>
            </div>

            <div class="wallpaper-grid" id="wallpaperGrid">
                <!-- Danh sách hình nền động/tĩnh sẽ hiển thị ở đây -->
            </div>
        </div>
    </div>

    <!-- Modal Upload Cloudinary -->
    <div class="modal" id="uploadModal">
        <div class="modal-content">
            <h3>Đăng hình nền lên Cộng đồng</h3>
            <div class="form-group">
                <label>Tên tác giả:</label>
