<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock Live Wallpaper - Fast Gallery</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #0b0f19; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        header { text-align: center; margin-bottom: 20px; }
        h1 { color: #38bdf8; font-size: 24px; }
        p { color: #94a3b8; font-size: 13px; margin-top: 4px; }

        .layout { display: flex; flex-wrap: wrap; max-width: 1100px; width: 100%; gap: 25px; justify-content: center; }

        .phone-frame { width: 300px; height: 600px; background: #000; border: 10px solid #1e293b; border-radius: 36px; position: relative; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.8); }
        .bg-media { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        
        .clock-overlay { position: absolute; top: 35%; left: 50%; transform: translate(-50%, -50%); z-index: 2; text-align: center; cursor: move; user-select: none; touch-action: none; width: 100%; }
        .time-display { font-size: 52px; font-weight: 700; color: #ffffff; text-shadow: 0 4px 12px rgba(0,0,0,0.9); }
        .date-display { font-size: 14px; color: #e2e8f0; text-shadow: 0 2px 8px rgba(0,0,0,0.9); margin-top: 4px; }

        .community-panel { flex: 1; min-width: 320px; background: #1e293b; padding: 20px; border-radius: 20px; border: 1px solid #334155; }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .btn { padding: 8px 16px; background: #0284c7; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: #0369a1; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; max-height: 480px; overflow-y: auto; padding-right: 4px; }
        .card { position: relative; height: 200px; border-radius: 10px; overflow: hidden; cursor: pointer; border: 2px solid transparent; background: #0f172a; }
        .card:hover { border-color: #38bdf8; }
        .card img, .card video { width: 100%; height: 100%; object-fit: cover; }
        .card-tag { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.7); padding: 5px; font-size: 10px; color: #fff; text-align: center; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 100; justify-content: center; align-items: center; }
        .modal-box { background: #1e293b; padding: 20px; border-radius: 12px; width: 320px; border: 1px solid #334155; }
        .field { margin-bottom: 12px; }
        .field label { font-size: 12px; color: #cbd5e1; display: block; margin-bottom: 4px; }
        .field input { width: 100%; padding: 8px; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 6px; }
    </style>
</head>
<body>

    <header>
        <h1>📱 Live Wallpaper Cloud Gallery</h1>
        <p>Đồng bộ trực tiếp qua Cloudinary (mdkn3zbh)[cite: 9]</p>
    </header>

    <div class="layout">
        <div class="phone-frame" id="phoneFrame">
            <img id="bgImage" class="bg-media" src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe">
            <video id="bgVideo" class="bg-media" autoplay muted loop playsinline style="display: none;"></video>

            <div class="clock-overlay" id="clockOverlay">
                <div class="time-display" id="timeText">00:00</div>
                <div class="date-display" id="dateText">Thứ Sáu, 24 Th10</div>
            </div>
        </div>

        <div class="community-panel">
            <div class="panel-header">
                <h3>Thư viện cộng đồng</h3>
                <button class="btn" onclick="openModal()">📤 Đăng lên App</button>
            </div>
            <div class="grid" id="wallpaperGrid">
                <p style="color:#94a3b8; font-size:13px; padding:10px;">Đang tải...</p>
            </div>
        </div>
    </div>

    <div class="modal" id="uploadModal">
        <div class="modal-box">
            <h3 style="margin-bottom: 10px; color: #38bdf8;">Đăng hình nền mới</h3>
            <div class="field">
                <label>Chọn Ảnh hoặc Video:</label>
                <input type="file" id="file" accept="image/*,video/*">
            </div>
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button class="btn" style="flex:1" onclick="uploadMedia()">Tải lên ngay</button>
                <button class="btn" style="flex:1; background:#475569" onclick="closeModal()">Hủy</button>
            </div>
        </div>
    </div>

    <script>
        const CLOUD_NAME = "mdkn3zbh";[cite: 9]
        const UPLOAD_PRESET = "gw_unsigned";[cite: 9]
        const PUBLIC_TAG = "gw_public";[cite: 9]

        // Lưu trữ danh sách bài đăng cục bộ kết hợp bộ nhớ đệm để load lập tức không bị treo
        let wallpapers = JSON.parse(localStorage.getItem('wallpapers_cache') || '[]');

        function renderGrid() {
            const grid = document.getElementById('wallpaperGrid');
            grid.innerHTML = '';

            if (wallpapers.length === 0) {
                grid.innerHTML = `<p style="color:#94a3b8; font-size:13px; padding:10px;">Chưa có hình nền nào. Hãy bấm đăng để thêm mới!</p>`;
                return;
            }

            wallpapers.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => setPreview(item);

                if (item.type === 'video') {
                    card.innerHTML = `<video src="${item.url}" muted loop playsinline></video><div class="card-tag">🎥 Video động</div>`;
                } else {
                    card.innerHTML = `<img src="${item.url}"><div class="card-tag">🖼️ Hình nền</div>`;
                }
                grid.appendChild(card);
                if (index === 0) setPreview(item);
            });
        }

        async function uploadMedia() {
            const fileInput = document.getElementById('file').files[0];
            if (!fileInput) return alert('Hãy chọn file!');

            const formData = new FormData();
            formData.append('file', fileInput);
            formData.append('upload_preset', UPLOAD_PRESET);[cite: 9]
            formData.append('tags', PUBLIC_TAG);[cite: 9]

            try {
                alert('Đang tải lên Cloudinary...');
                const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/upload`, {[cite: 9]
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                if (data.secure_url) {
                    const isVideo = fileInput.type.startsWith('video/');
                    wallpapers.unshift({
                        url: data.secure_url,
                        type: isVideo ? 'video' : 'image'
                    });
                    localStorage.setItem('wallpapers_cache', JSON.stringify(wallpapers));
                    renderGrid();
                    setPreview(wallpapers[0]);
                    closeModal();
                    alert('Đăng thành công!');
                } else {
                    alert('Lỗi: ' + (data.error ? data.error.message : 'Unknown'));
                }
            } catch (err) {
                alert('Lỗi kết nối: ' + err.message);
            }
        }

        function setPreview(wp) {
            const img = document.getElementById('bgImage');
            const vid = document.getElementById('bgVideo');
            if (wp.type === 'video') {
                vid.src = wp.url; vid.style.display = 'block'; img.style.display = 'none';
            } else {
                img.src = wp.url; img.style.display = 'block'; vid.style.display = 'none';
            }
        }

        function openModal() { document.getElementById('uploadModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('uploadModal').style.display = 'none'; }

        setInterval(() => {
            const now = new Date();
            document.getElementById('timeText').innerText = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
        }, 1000);

        // Chạy ngay lập tức không chờ đợi mạng chậm
        renderGrid();
    </script>
</body>
</html>
